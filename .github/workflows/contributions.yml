# Redraws the 2-month contributions chart in the profile README once a day.
# Commits come from github-actions[bot], so they never count as the owner's contributions.
name: Contributions chart

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/contrib_chart.py"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: contributions-chart
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The script reads the token from stdin instead of the environment.
        run: printf '%s' "$GH_TOKEN" | python3 scripts/contrib_chart.py

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Chart unchanged."
          else
            git commit -m "Update 2-month contributions chart"
            git push
          fi
